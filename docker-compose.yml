version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./uploads:/var/www/html/uploads
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: quiz_system
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./quiz_system.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
